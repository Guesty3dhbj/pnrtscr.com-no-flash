<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Screenshot</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        #content {
            max-width: 500px;
            text-align: center;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div id="overlay">
    <div id="content">
        <h2>Cookies and user-generated content</h2>

        <p>
            This website uses cookies to offer you the most relevant information
            and better understand how you use this website.
        </p>

        <p>
            User-generated content may not be suitable for visitors who are at
            <b>high risk of photosensitive epileptic seizures</b>.
        </p>

        <button id="accept">Accept</button>
        <button id="decline">Decline</button>
    </div>
</div>

<video id="video" src="./video.mp4" loop playsinline preload="auto"></video>

<script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");

    function startVideo() {
        overlay.style.display = "none";

        video.currentTime = 0;

        video.play().catch(error => {
            console.error("No se pudo reproducir:", error);
        });

        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    }

    document.getElementById("accept").addEventListener("click", startVideo);
    document.getElementById("decline").addEventListener("click", startVideo);
</script>

</body>
</html>
